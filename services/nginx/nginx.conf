upstream strapi {
    # Use the generic backend service name
    server backend:1337;
}

upstream nextjs {
    # Use the generic frontend service name
    server frontend:3000;
}

server {
    listen 80;
    server_name 127.0.0.1;
    
    # Hide NGINX version in error pages for security
    server_tokens off;

    error_page 404 /404.html;

    # Strapi API and Admin
    location /claustrum/ {
        # Rewrite rule to strip the prefix
        rewrite ^/claustrum/?(.*)$ /$1 break;
        
        proxy_pass http://strapi;
        proxy_http_version 1.1;
        
        # Standardized headers for Strapi v5
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Preserved request header passthrough
        proxy_pass_request_headers on;
    }

    # Next.js Frontend
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        
        # Standardized headers for Next.js App/Pages router
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Preserved cache bypass for WebSockets/HMR
        proxy_cache_bypass $http_upgrade;
    }
}